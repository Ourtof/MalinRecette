security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            jwt: ~

    access_control:
        - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/recettes, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/tags, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/illustrations, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/recettes, roles: IS_AUTHENTICATED_FULLY, methods: [POST] }
        - { path: ^/api/illustrations, roles: IS_AUTHENTICATED_FULLY, methods: [POST] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
