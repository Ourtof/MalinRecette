nelmio_cors:
  defaults:
    origin_regex: true
    allow_origin:
      - '^http://localhost:\d+$'
      - '^http://127\.0\.0\.1:\d+$'
      - '^https://localhost:\d+$'
      - '^https://127\.0\.0\.1:\d+$'
    allow_methods: ['GET','POST','PUT','PATCH','DELETE','OPTIONS']
    allow_headers: ['Content-Type','Authorization', 'Accept', 'Origin',]
    expose_headers: ['Authorization']
    allow_credentials: false
    max_age: 3600
  paths:
    '^/': ~
