nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['*']
        allow_headers: ['*']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        expose_headers: ['*']
        max_age: 3600
        allow_credentials: false

    paths:
        '^/api/':
            allow_origin: ['*']
            allow_headers: ['*']
            allow_methods: ['POST', 'GET', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            allow_credentials: false
            max_age: 3600

        '^/uploads/':
            allow_origin: ['*']
            allow_headers: ['*']
            allow_methods: ['GET', 'OPTIONS']
            allow_credentials: false
            max_age: 3600

# permet d'accepter toutes les origines car dart ne permet pas le crossOrigin en local. 
